# Prometheus para consultar y graficar las métricas de httpaas-go.
# Uso: docker compose -f monitoring/docker-compose.yml up -d, y abrir http://localhost:9090
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./secrets/httpaas-password:/etc/prometheus/httpaas-password:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
